<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Site en maintenance — METOMBOU Nérias. De retour très bientôt.">
  <meta name="theme-color" content="#0A0F1E">
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230A0F1E'/%3E%3Ctext x='50' y='68' font-size='54' text-anchor='middle' fill='%231f6feb' font-family='Arial' font-weight='700'%3EN%3C/text%3E%3C/svg%3E">
  <title>Maintenance en cours — METOMBOU Nérias</title>
  <style>
    /* Zéro requête externe (aucune police, aucun CDN) : rendu instantané
     même sur réseau lent — cohérent avec l'esprit "technicien réseau"
     de ne jamais dépendre d'une ressource qu'on ne maîtrise pas. */
    :root {
      --bg: #0A0F1E;
      --surface: #111827;
      --border: rgba(59, 130, 246, .18);
      --accent: #1f6feb;
      --accent-h: #388bfd;
      --amber: #d29922;
      --amber-bg: rgba(210, 153, 34, .12);
      --t1: #e6edf3;
      --t2: #8b949e;
      --t3: #484f58;
      --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono: ui-monospace, 'SFMono-Regular', Consolas, 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: 15px;
    }

    body {
      min-height: 100dvh;
      font-family: var(--sans);
      color: var(--t1);
      background:
        radial-gradient(circle at 18% 20%, rgba(59, 130, 246, .16), transparent 26%),
        radial-gradient(circle at 84% 16%, rgba(139, 92, 246, .12), transparent 24%),
        var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }

    main {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }

    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 22px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--mono);
      font-size: .62rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--amber);
      background: var(--amber-bg);
      border: 1px solid rgba(210, 153, 34, .3);
      padding: 5px 12px;
      border-radius: 20px;
      margin-bottom: 18px;
    }

    .pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    h1 {
      font-size: clamp(1.2rem, 5vw, 1.45rem);
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 10px;
    }

    p {
      font-size: .84rem;
      color: var(--t2);
      line-height: 1.7;
      margin-bottom: 26px;
    }

    hr {
      border: none;
      height: 1px;
      background: var(--border);
      margin-bottom: 22px;
    }

    .lbl {
      font-family: var(--mono);
      font-size: .58rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--t3);
      margin-bottom: 11px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .76rem;
      font-weight: 500;
      color: var(--t1);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: rgba(31, 111, 235, .06);
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
      border-color: rgba(96, 165, 250, .4);
      background: rgba(31, 111, 235, .14);
      transform: translateY(-1px)
    }

    footer {
      margin-top: 24px;
      font-family: var(--mono);
      font-size: .6rem;
      color: var(--t3);
    }

    footer b {
      color: var(--accent-h);
      font-weight: 400;
    }

    @media (max-width: 380px) {
      main {
        padding: 28px 20px;
      }

      .row {
        flex-direction: column;
      }

      .btn {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <main role="main">
    <div class="pill">Maintenance en cours</div>

    <h1>Le site est en cours de mise à jour</h1>
    <div class="lbl">Me contacter directement</div>
    <div class="row">
      <a class="btn" href="mailto:neriasmetombou@gmail.com">Email</a>
      <a class="btn" href="https://wa.me/2290152240507" target="_blank" rel="noopener noreferrer">WhatsApp</a>
    </div>

    <footer>METOMBOU Nérias — Cotonou, Bénin</footer>
  </main>
</body>

</html>
